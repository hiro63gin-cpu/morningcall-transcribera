name: NAB Morning Call

on:
  schedule:
    - cron: '45 5 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morningcall:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, transcribe, and summarize latest episode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python src/morningcall.py

      - name: Commit report and state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ state/
          if git diff --cached --quiet; then
            echo 'No new episode/report to commit.'
          else
            git commit -m 'Update NAB Morning Call report'
            git push
          fi
