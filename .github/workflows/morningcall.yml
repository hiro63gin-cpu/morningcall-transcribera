name: NAB Morning Call

on:
  schedule:
    - cron: '45,55 5 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '5,15,25,35,45,55 6 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/morningcall.py'

permissions:
  contents: write

concurrency:
  group: nab-morning-call
  cancel-in-progress: false

jobs:
  morningcall:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, transcribe, and summarize latest episode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python src/morningcall.py

      - name: Commit report and state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ state/
          if git diff --cached --quiet; then
            echo 'No new episode/report to commit.'
          else
            git commit -m 'Update NAB Morning Call report'
            git push
          fi
